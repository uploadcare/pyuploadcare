# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
      - "feature/**"
      - "version-3.x/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: Run linters
        run: make lint

  functional:
    needs: lint

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: Test with pytest
        run: |
          make test-functional

  django-2-and-3:
    needs: functional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://docs.djangoproject.com/en/2.2/faq/install/#what-python-version-can-i-use-with-django
        # https://docs.djangoproject.com/en/3.2/faq/install/#what-python-version-can-i-use-with-django
        python-version: ["3.8", "3.9"]
        django-version: ["2.2", "3.0", "3.1", "3.2"]

        include:
          - python-version: "3.10"
            django-version: "3.2"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install poetry
        run: pipx install poetry==2.4.1
      - name: install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: install specific django version
        run: |
          poetry run pip install django~=${{ matrix.django-version }}
      - name: test with pytest
        run: |
          make test-django

  django-4:
    needs: functional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://docs.djangoproject.com/en/4.2/faq/install/#what-python-version-can-i-use-with-django
        python-version: ["3.8", "3.9", "3.10"]
        django-version: ["4.0", "4.1", "4.2"]

        include:
          - python-version: "3.11"
            django-version: "4.1"

          - python-version: "3.11"
            django-version: "4.2"

          - python-version: "3.12"
            django-version: "4.2"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install poetry
        run: pipx install poetry==2.4.1
      - name: install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: install specific django version
        run: |
          poetry run pip install django~=${{ matrix.django-version }}
      - name: test with pytest
        run: |
          make test-django

  django-5:
    needs: functional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://docs.djangoproject.com/en/5.2/faq/install/#what-python-version-can-i-use-with-django
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.0", "5.1", "5.2"]
        exclude:
          - python-version: "3.13"
            django-version: "5.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install poetry
        run: pipx install poetry==2.4.1
      - name: install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: install specific django version
        run: |
          poetry run pip install django~=${{ matrix.django-version }}
      - name: test with pytest
        run: |
          make test-django

  django-6:
    needs: functional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://docs.djangoproject.com/en/6.0/faq/install/#what-python-version-can-i-use-with-django
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["6.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install poetry
        run: pipx install poetry==2.4.1
      - name: install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: install specific django version
        run: |
          poetry run pip install django~=${{ matrix.django-version }}
      - name: test with pytest
        run: |
          make test-django

  integration:
    needs: functional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies
        run: |
          poetry env use python
          poetry install --with dev
      - name: Test with pytest
        run: |
          make test-integration
        env:
          UPLOADCARE_PUBLIC_KEY: ${{ secrets.UPLOADCARE_PUBLIC_KEY }}
          UPLOADCARE_SECRET_KEY: ${{ secrets.UPLOADCARE_SECRET_KEY }}
