[project]
name = "pyuploadcare"
version = "7.0.2"
description = "Python library for Uploadcare.com"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Uploadcare Inc", email = "hello@uploadcare.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx2>=2.9.1,<3",
    "pydantic[email]>=2.13.4,<3",
    "python-dateutil>=2.8.2,<3",
    "typing-extensions>=4.14.1,<5",
]

[project.optional-dependencies]
django = ["Django>=3.2"]

[project.scripts]
ucare = "pyuploadcare.ucare_cli.main:main"

[project.urls]
Homepage = "https://uploadcare.com"
Repository = "https://github.com/uploadcare/pyuploadcare"
"Bug Tracker" = "https://github.com/uploadcare/pyuploadcare/issues"

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "ruff>=0.17.5,<0.18",
    "mypy>=1.7.1,<2",
    "pytest-vcr>=1.0.2,<2",
    "vcrpy>=8.0,<9",
    "yarl>=1.9.4,<2",
    "Django>=3.2,<6.2",
    "coverage>=7.3.3,<8",
    "pytest-cov>=4.1.0,<5",
    "python-coveralls>=2.9.3,<3",
    "types-python-dateutil>=2.8.19.14,<3",
    "types-pytz>=2025.1.0.20250204,<2026",
    "Sphinx>=7.1.2,<8",
    "sphinx-argparse>=0.4.0,<0.5",
    "types-dataclasses>=0.6.6,<0.7",
    "pytest-freezer>=0.4.8,<0.5",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["**/migrations/*", "snapshots"]

[tool.ruff.format]
# keep docs snippets as written
exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, C90: mccabe, T20: flake8-print,
# I: isort, UP: pyupgrade
select = ["E", "W", "F", "C90", "T20", "I", "UP"]
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
"pyuploadcare/ucare_cli/**" = ["T201", "T203"]
"scripts/**" = ["T201", "C901"]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
known-first-party = ["pyuploadcare"]
lines-after-imports = 2
