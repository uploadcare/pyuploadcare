[project]
name = "pyuploadcare"
version = "6.3.0"
description = "Python library for Uploadcare.com"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Uploadcare Inc", email = "hello@uploadcare.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx2>=2.9.1,<3",
    "pydantic[email]>=2.13.4,<3",
    "python-dateutil>=2.8.2,<3",
    "typing-extensions>=4.14.1,<5",
]

[project.optional-dependencies]
django = ["Django>=3.2"]

[project.scripts]
ucare = "pyuploadcare.ucare_cli.main:main"

[project.urls]
Homepage = "https://uploadcare.com"
Repository = "https://github.com/uploadcare/pyuploadcare"
"Bug Tracker" = "https://github.com/uploadcare/pyuploadcare/issues"

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "black>=24.3.0,<25",
    "isort>=6.0.1,<7",
    "flake8>=6.1.0,<7",
    "mypy>=1.7.1,<2",
    "flake8-print>=5.0.0,<6",
    "pytest-vcr>=1.0.2,<2",
    "vcrpy>=8.0,<9",
    "yarl>=1.9.4,<2",
    "Django>=4.2.8,<5",
    "coverage>=7.3.3,<8",
    "pytest-cov>=4.1.0,<5",
    "python-coveralls>=2.9.3,<3",
    "types-python-dateutil>=2.8.19.14,<3",
    "types-pytz>=2025.1.0.20250204,<2026",
    "Sphinx>=7.1.2,<8",
    "sphinx-argparse>=0.4.0,<0.5",
    "types-dataclasses>=0.6.6,<0.7",
    "pytest-freezer>=0.4.8,<0.5",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.black]
line-length = 79
target-version = ['py310']
exclude = '''
(
  \.eggs
  |\.git
  |\.hg
  |\.mypy_cache
  |\.nox
  |\.tox
  |\.venv
  |_build
  |buck-out
  |build
  |dist
)
'''

[tool.isort]
line_length = 79
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
src_paths = "pyuploadcare"
include_trailing_comma = "true"
lines_after_imports = 2
